<!doctype html>
<meta charset="utf-8">
<style>
@font-face{font-family:Cairo;src:url(fonts/Cairo.ttf);font-weight:100 1000}
html,body{margin:0;background:transparent}
canvas{display:block}
</style>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,Y='#FFD400',Y2='#FFB800',WH='#fff',DK='#15110a';
const c=document.getElementById('c'),g=c.getContext('2d');
const FONT='Cairo, DejaVu Sans, sans-serif';
const pl={};for(const i of[2,3,4,5,6]){const im=new Image();im.src='assets/pl'+i+'.png';pl[i]=im}
const logo=new Image();logo.src='logo.png';
let captions=[];
window.setCaptions=v=>{captions=v};
const imgs=[];for(let i=0;i<18;i++){const im=new Image();im.src='assets/f'+i+'.jpg';imgs.push(im)}
window.ready=Promise.all([...Object.values(pl).map(im=>new Promise(r=>{im.onload=r;im.onerror=r})),...imgs.map(im=>new Promise(r=>{im.onload=r;im.onerror=r})),document.fonts.load('900 60px Cairo'),new Promise(r=>{logo.onload=r;logo.onerror=r})]);

const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const easeOut=x=>1-Math.pow(1-x,3);
const easeInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const s=1.70158;x-=1;return x*x*((s+1)*x+s)+1};
const rnd=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const pad=(n,l=2)=>String(Math.floor(n)).padStart(l,'0');

function rr(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r)}
function txt(s,x,y,size,{fill=WH,weight=900,align='center',glow=null,stroke=null,sw=0,rtl=true,mono=false}={}){
  g.save();g.font=`${weight} ${size}px ${mono?'"DejaVu Sans Mono",monospace':FONT}`;
  g.textAlign=align;g.textBaseline='middle';g.direction=rtl?'rtl':'ltr';
  if(glow){g.shadowColor=glow;g.shadowBlur=size*.45}
  if(stroke){g.lineWidth=sw;g.strokeStyle=stroke;g.lineJoin='round';g.strokeText(s,x,y)}
  g.fillStyle=fill;g.fillText(s,x,y);g.restore();
}
function dim(a){g.fillStyle=`rgba(10,8,2,${a})`;g.fillRect(0,0,W,H)}

// ---------- decorative helpers
function scissors(cx,cy,s,open){
  g.save();g.translate(cx,cy);g.scale(s,s);g.strokeStyle=Y;g.fillStyle=Y;g.lineWidth=14;g.lineCap='round';
  g.shadowColor=Y;g.shadowBlur=40;
  for(const d of[-1,1]){g.save();g.rotate(d*open);g.beginPath();g.moveTo(0,0);g.lineTo(d*-30,-190);g.lineTo(d*-6,-190);g.closePath();g.fill();
    g.beginPath();g.arc(d*55,120,42,0,7);g.stroke();g.beginPath();g.moveTo(0,0);g.lineTo(d*40,90);g.stroke();g.restore()}
  g.beginPath();g.arc(0,0,14,0,7);g.fillStyle=DK;g.fill();g.stroke();g.restore();
}
function wave(cx,cy,w,h,t,n=41){
  g.save();g.fillStyle=Y;g.shadowColor=Y;g.shadowBlur=30;
  for(let i=0;i<n;i++){const x=cx-w/2+i*(w/(n-1));const a=.25+.75*Math.abs(Math.sin(i*.55+t*14)*Math.cos(i*.21-t*7));
    const hh=h*a;rr(x-7,cy-hh/2,14,hh,7);g.fill()}g.restore();
}
function sparkle(cx,cy,r,rot=0){
  g.save();g.translate(cx,cy);g.rotate(rot);g.beginPath();
  for(let i=0;i<8;i++){const a=i*Math.PI/4,rad=i%2?r*.28:r;g.lineTo(Math.cos(a)*rad,Math.sin(a)*rad)}
  g.closePath();g.restore();
}
function landscape(x,y,w,h,seed=0,hue=0){
  g.save();rr(x,y,w,h,24);g.clip();
  let gr=g.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,`hsl(${200+hue},70%,62%)`);gr.addColorStop(.6,`hsl(${30+hue},90%,75%)`);gr.addColorStop(1,'#fff');
  g.fillStyle=gr;g.fillRect(x,y,w,h);
  g.fillStyle='#fff8';g.beginPath();g.arc(x+w*(.25+rnd(seed)*.5),y+h*.3,w*.09,0,7);g.fill();
  for(let k=0;k<3;k++){g.fillStyle=`hsl(${120+hue+k*15},${45-k*8}%,${30+k*12}%)`;g.beginPath();g.moveTo(x,y+h);
    for(let i=0;i<=8;i++)g.lineTo(x+w*i/8,y+h*(.55+k*.13)-h*.14*rnd(seed*7+k*3+i));g.lineTo(x+w,y+h);g.fill()}
  g.restore();
}
function playBadge(cx,cy,r){g.save();g.fillStyle='#000a';g.beginPath();g.arc(cx,cy,r,0,7);g.fill();g.fillStyle=Y;g.beginPath();
  g.moveTo(cx-r*.3,cy-r*.45);g.lineTo(cx+r*.5,cy);g.lineTo(cx-r*.3,cy+r*.45);g.fill();g.restore()}

// ---------- shared full-screen helpers
function bg(t,mode='dark'){
  if(mode==='yellow'){g.fillStyle=Y;g.fillRect(0,0,W,H);}
  else if(mode==='white'){g.fillStyle='#fffdf2';g.fillRect(0,0,W,H);}
  else{g.fillStyle='#0c0a04';g.fillRect(0,0,W,H);
    const gr=g.createRadialGradient(W/2,H*.45,50,W/2,H*.45,1100);gr.addColorStop(0,'rgba(255,200,0,.22)');gr.addColorStop(1,'rgba(255,200,0,0)');g.fillStyle=gr;g.fillRect(0,0,W,H);
    g.strokeStyle='rgba(255,212,0,.06)';g.lineWidth=2;const o=(t*40)%60;
    for(let x=-60+o;x<W;x+=60){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}
    for(let y=-60+o;y<H;y+=60){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
    g.fillStyle='rgba(255,212,0,.5)';for(let i=0;i<30;i++){const x=(rnd(i)*W+t*20*(1+rnd(i+5)))%W,y=(rnd(i+9)*H-t*60*(.3+rnd(i+2))+H*3)%H;g.beginPath();g.arc(x,y,2+rnd(i+3)*3,0,7);g.fill()}}
}
function wipe(t,t0,dur=.4){ // diagonal yellow+white sweep over boundary
  const p=prog(t,t0-dur/2,t0+dur/2);if(p<=0||p>=1)return;
  const x=-500+(W+1000)*p;g.save();
  g.fillStyle=WH;g.beginPath();g.moveTo(x-330,0);g.lineTo(x-150,0);g.lineTo(x-350,H);g.lineTo(x-530,H);g.fill();
  g.fillStyle=Y;g.shadowColor=Y;g.shadowBlur=70;g.beginPath();g.moveTo(x-200,0);g.lineTo(x+250,0);g.lineTo(x+50,H);g.lineTo(x-400,H);g.fill();g.restore();
}
function card(x,y,w,h,rot,fill,fn){g.save();g.translate(x,y);g.rotate(rot);g.shadowColor='rgba(0,0,0,.45)';g.shadowBlur=30;g.shadowOffsetY=12;rr(-w/2,-h/2,w,h,20);g.fillStyle=fill;g.fill();g.shadowColor='transparent';
  if(fn){g.save();rr(-w/2,-h/2,w,h,20);g.clip();fn(w,h);g.restore()}g.restore()}
function still(i,w,h,dx=0){const im=imgs[i%imgs.length];if(!im.width)return;const ar=im.width/im.height;let dw=w,dh=w/ar;if(dh<h){dh=h;dw=h*ar}g.drawImage(im,-dw/2+dx,-dh/2,dw,dh)}

// procedural moving nature clip (placeholder for real B-roll)
function nature(x,y,w,h,seed,t,r=16){
  g.save();rr(x,y,w,h,r);g.clip();
  const th=[[205,35],[20,55],[275,45],[195,60]][seed%4];
  let gr=g.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,`hsl(${th[0]},75%,${45+th[1]/4}%)`);gr.addColorStop(.7,`hsl(${(th[0]+150)%360},90%,78%)`);gr.addColorStop(1,'#fff');g.fillStyle=gr;g.fillRect(x,y,w,h);
  const sx=x+((seed*97+t*30)%(w*1.4))-w*.2;g.fillStyle='rgba(255,255,230,.9)';g.beginPath();g.arc(sx,y+h*.3,w*.09,0,7);g.fill();
  for(let k=0;k<4;k++){const sp=(k+1)*18;const off=-(t*sp+seed*40)%(w/2);g.fillStyle=`hsl(${130-k*8+seed*10},${50-k*6}%,${20+k*11}%)`;g.beginPath();g.moveTo(x,y+h);
    for(let i=-1;i<=9;i++){const px=x+off+i*(w/4);g.lineTo(px,y+h*(.5+k*.11)-h*.12*rnd(seed*13+k*5+((i+Math.floor(-off/(w/4)*0+ (i<0?0:0)))&7)))}
    g.lineTo(x+w,y+h);g.fill()}
  g.fillStyle='rgba(255,255,255,.18)';for(let i=0;i<6;i++){const cy=y+h*.85+i*h*.03;g.fillRect(x,cy+Math.sin(t*3+i)*4,w,2)}
  g.restore();
}
const N=(a,b,t)=>a+(b-a)*t;

// ---------- S1 clock (behind speaker layer)
function s1clock(t){
  const p=prog(t,0,.35),o=Math.min(p,1-prog(t,3.7,4));
  const k=easeInOut(prog(t,.25,3.7));const sec=k*5*3600;
  g.save();g.globalAlpha=o;g.translate(W/2,370);const sc=.8+.2*easeOut(p);g.scale(sc,sc);
  const hh=Math.floor(sec/3600),mm=Math.floor(sec/60)%60,ss=Math.floor(sec)%60;
  rr(-470,-125,940,250,46);g.fillStyle='rgba(14,10,0,.82)';g.fill();g.lineWidth=6;g.strokeStyle=Y;g.stroke();
  g.shadowColor=Y;g.shadowBlur=40;
  txt(`${pad(hh)}:${pad(mm)}:${pad(ss)}`,0,0,182,{fill:Y,glow:Y,mono:true,rtl:false,weight:700});
  g.shadowBlur=0;
  g.globalAlpha=o*.9;rr(-380,150,760,12,6);g.fillStyle='rgba(255,255,255,.25)';g.fill();rr(-380,150,760*k,12,6);g.fillStyle=WH;g.fill();
  g.restore();
}

// ---------- S2 After Effects style screen (4-6)
function s2(t){
  const l=t-4;bg(t);
  // window chrome
  g.fillStyle='#1b1810';g.fillRect(0,0,W,86);
  ['#ff5f57','#febc2e','#28c840'].forEach((c,i)=>{g.fillStyle=c;g.beginPath();g.arc(48+i*38,43,12,0,7);g.fill()});
  txt('Adobe After Effects  -  Wasted_Time.aep',W/2+90,43,30,{fill:'#a89a5a',weight:600,rtl:false});
  // viewer
  const vx=36,vy=112,vw=1008,vh=920;
  rr(vx,vy,vw,vh,18);g.fillStyle='#050402';g.fill();g.lineWidth=3;g.strokeStyle='#40350c';g.stroke();
  g.strokeStyle='rgba(255,212,0,.25)';g.lineWidth=2;g.setLineDash([12,10]);g.strokeRect(vx+70,vy+70,vw-140,vh-140);g.setLineDash([]);
  g.fillStyle='rgba(255,212,0,.6)';for(const[cx,cy]of[[vx+70,vy+70],[vx+vw-70,vy+70],[vx+70,vy+vh-70],[vx+vw-70,vy+vh-70]]){g.fillRect(cx-9,cy-9,18,18)}
  const total=easeInOut(prog(l,.1,1.2));const mins=Math.round(N(300,75,total));
  const swap=prog(l,1.25,1.7);
  g.save();g.translate(W/2,vy+vh/2-40);
  if(swap<1){g.globalAlpha=1-swap;g.scale(1-swap*.15,1-swap*.15);
    txt(`${Math.floor(mins/60)}:${pad(mins%60)}`,0,-20,420,{fill:Y,glow:Y,mono:true,rtl:false,weight:700});
    txt('TIME WASTED  |  hours',0,215,44,{fill:'#a89a5a',rtl:false,weight:600})}
  g.restore();
  if(swap>0){const s=back(swap);g.save();g.translate(W/2,vy+vh/2-20);
    const gr=g.createRadialGradient(0,0,10,0,0,620);gr.addColorStop(0,'rgba(255,212,0,.75)');gr.addColorStop(.5,'rgba(255,190,0,.25)');gr.addColorStop(1,'rgba(255,190,0,0)');g.fillStyle=gr;g.fillRect(-620,-620,1240,1240);
    g.rotate(-.03);g.scale(s,s);txt('ربع الوقت',0,0,175,{fill:WH,glow:Y,stroke:'rgba(90,60,0,.7)',sw:16});
    g.restore();
    if(prog(l,1.2,1.4)<1){g.fillStyle=`rgba(255,255,255,${.5*(1-prog(l,1.2,1.4))})`;g.fillRect(vx,vy,vw,vh)}}
  // property slider under viewer with cursor
  const sx0=120,sx1=960,sy=1090;
  rr(sx0,sy-7,sx1-sx0,14,7);g.fillStyle='#2f280c';g.fill();
  const kx=N(sx1,sx0+(sx1-sx0)*.15,total);rr(sx0,sy-7,kx-sx0,14,7);g.fillStyle=Y;g.fill();
  txt('Time',105,sy,30,{fill:'#a89a5a',rtl:false,weight:700,align:'right'});
  g.fillStyle=WH;g.shadowColor=Y;g.shadowBlur=25;g.beginPath();g.arc(kx,sy,26,0,7);g.fill();g.shadowBlur=0;
  const cp=1+prog(l,0,.15)*0;g.save();g.translate(kx+26,sy+26);g.fillStyle=WH;g.strokeStyle=DK;g.lineWidth=5;g.beginPath();g.moveTo(0,0);g.lineTo(0,74);g.lineTo(20,56);g.lineTo(36,96);g.lineTo(52,88);g.lineTo(35,50);g.lineTo(62,48);g.closePath();g.fill();g.stroke();g.restore();
  // timeline panel
  const ty=1190;g.fillStyle='#14110a';g.fillRect(0,ty,W,H-ty);g.fillStyle='#24200f';g.fillRect(0,ty,W,60);
  txt('0:00:0'+Math.floor(l*3)+'  ·  30 fps',40,ty+30,28,{fill:Y,rtl:false,align:'left',weight:700});
  const rows=[['Scale',Y],['Time Remap',WH],['Opacity','#a89a5a'],['Position','#a89a5a'],['Rotation','#a89a5a']];
  rows.forEach(([nm,cc],i)=>{const y=ty+100+i*105;g.fillStyle=i%2?'#181509':'#1d190b';g.fillRect(0,y-42,W,105);
    txt(nm,60,y+8,34,{fill:'#d9c877',rtl:false,align:'left',weight:600});
    const a=prog(l,.1+i*.12,.5+i*.12);rr(340,y-14,(600+ (i*37)%180)*a,44,10);g.fillStyle=i<2?cc:'#5d4f14';g.globalAlpha=.85;g.fill();g.globalAlpha=1;
    if(i<2){for(const kf of[0,.5,1]){g.save();g.translate(340+kf*560,y+8);g.rotate(Math.PI/4);g.fillStyle=kf<=total+.001?Y:'#403610';g.fillRect(-11,-11,22,22);g.restore()}}});
  const px=340+total*560;g.fillStyle='#ff4d3d';g.fillRect(px-2,ty+60,4,H-ty-60);g.beginPath();g.moveTo(px-16,ty+60);g.lineTo(px+16,ty+60);g.lineTo(px,ty+92);g.fill();
}

// ---------- S3 collage fast cuts (6-11)
const WORDS=['قص','سريع','تلقائي','اختصار','وقت','CUT','FAST','AUTO'];
function s3(t){
  const l=t-6,beat=.83,i=Math.floor(l/beat),b=(l%beat)/beat;
  const mode=[ 'yellow','dark','white','dark','yellow','dark'][i%6];
  bg(t,mode);
  const zin=i%2===0;const z=zin?N(1.45,1,easeOut(clamp(b*1.6))):N(.72,1,easeOut(clamp(b*1.6)));
  const drift=1+b*.06;
  g.save();g.translate(W/2,H/2);g.scale(z*drift,z*drift);g.rotate((rnd(i)-.5)*.05*(1-clamp(b*3)));g.translate(-W/2,-H/2);
  const ink=mode==='yellow'||mode==='white'?DK:WH,acc=mode==='yellow'?DK:Y;
  const type=i%6;
  if(type===0){ // giant word + scissor card + still
    const w=WORDS[i%WORDS.length];txt(w,W/2+(1-easeOut(clamp(b*2)))*400,560,w.length>4?330:420,{fill:ink,stroke:mode==='dark'?'#000':null,sw:14,glow:mode==='dark'?Y:null,rtl:!/[A-Z]/.test(w)});
    card(310,1200,470,680,-.07,'#fff',(cw,ch)=>{g.drawImage(pl[2],-cw/2,-ch/2,cw,ch)});
    card(770,1330,420,420,.08,DK,(cw,ch)=>{});g.save();g.translate(770,1330);g.rotate(.08);scissors(0,30,.9,.12+.3*Math.abs(Math.sin(b*5)));g.restore();
  }else if(type===1){ // wave full + words
    wave(W/2,700,960,700,l+i,47);txt('AUTO CUT',W/2,1250,190,{fill:WH,glow:Y,rtl:false,stroke:'#000',sw:10});
    card(W/2,1560,880,200,0,'rgba(255,212,0,.15)',(cw,ch)=>{});wave(W/2,1560,820,130,l*2,61);
  }else if(type===2){ // grid of stills, punchy
    [[290,700,-.06,6],[790,860,.06,2]].forEach(([cx,cy,rt,id],k)=>{const a=back(clamp(b*2-k*.25));g.save();g.translate(cx,cy);g.scale(a,a);card(0,0,500,720,rt,'#111',(cw,ch)=>{g.drawImage(pl[id],-cw/2,-ch/2,cw,ch)});g.restore()});
    g.save();g.translate(W/2,H/2);scissors(0,0,2.1,.05+.35*Math.abs(Math.sin(b*4)));g.restore();
    txt('قص',W/2,1560,260,{fill:DK,stroke:Y,sw:16});
  }else if(type===3){ // film strip cut by scissors
    const cy=H/2;g.fillStyle='#000';g.fillRect(0,cy-260,W,520);
    for(let k=-1;k<7;k++){const fx=(k*300-l*500)%2100;g.fillStyle='#fff3';g.fillRect(fx,cy-235,20,40);g.fillRect(fx,cy+195,20,40)}
    for(let k=0;k<4;k++){const fx=((k*380+l*-260)%1600+1600)%1600-260;g.save();g.translate(fx+180,cy);g.rotate(0);g.beginPath();still(i+k,340,380);g.restore()}
    const cx=W*easeInOut(clamp(b*.9));g.fillStyle=Y;g.shadowColor=Y;g.shadowBlur=40;g.fillRect(cx-4,cy-330,8,660);g.shadowBlur=0;
    g.save();g.translate(cx,cy-380);g.rotate(Math.PI);scissors(0,0,1,.05+.3*Math.abs(Math.sin(b*6)));g.restore();
    txt('تلقائي',W/2,cy+560,250,{fill:WH,glow:Y});txt('CUT',W/2,cy-600,280,{fill:Y,glow:Y,rtl:false});
  }else if(type===4){ // stacked kinetic words
    const ws=[WORDS[(i+1)%8],WORDS[(i+3)%8],WORDS[(i+5)%8]];
    ws.forEach((w,k)=>{const dx=(1-easeOut(clamp(b*2.5-k*.2)))*(k%2?900:-900);const sz=/[A-Z]/.test(w)?300:340;
      txt(w,W/2+dx,400+k*420,sz,{fill:k===1?WH:DK,stroke:k===1?DK:null,sw:0,rtl:!/[A-Z]/.test(w)});
      g.fillStyle=k===1?DK:Y;g.fillRect(90,400+k*420+190,900*easeOut(clamp(b*3-k*.25)),10)});
  }else{ // timeline being sliced
    wave(W/2,500,960,420,l+i,47);
    for(let k=0;k<5;k++){const y=930+k*150,gap=easeOut(clamp(b*2-k*.1))*50;
      g.fillStyle=k%2?Y:WH;g.fillRect(70,y,440-gap/2,110);g.fillRect(510+gap/2,y,500-gap/2,110);
      g.fillStyle=acc;g.fillRect(508,y-30,4,170)}
    g.save();g.translate(W/2,1780);scissors(0,0,.75,.05+.3*Math.abs(Math.sin(b*5)));g.restore();
    txt('FAST CUT',W/2,760,150,{fill:WH,glow:Y,rtl:false,stroke:'#000',sw:8});
  }
  g.restore();
  if(b<.12){g.fillStyle=`rgba(255,255,255,${.4*(1-b/.12)})`;g.fillRect(0,0,W,H)}
}

// ---------- S4 B-roll search screen recording (11-14)
function s4(t){
  const l=t-11;bg(t);
  // real plugin header + tab bar
  const hd=pl[2];if(hd.width)g.drawImage(hd,0,0,1040,300,0,0,W,312);
  const tabx=W*(511/1040);const click=prog(l,.15,.4);
  g.strokeStyle=Y;g.lineWidth=5;g.shadowColor=Y;g.shadowBlur=20;rr(446,160,180,138,16);g.globalAlpha=click;g.stroke();g.globalAlpha=1;g.shadowBlur=0;
  // cursor to the tab
  const cpx=N(900,tabx+20,easeInOut(prog(l,0,.25))),cpy=N(600,235,easeInOut(prog(l,0,.25)));
  // search bar
  const py=350;rr(50,py,980,90,45);g.fillStyle='#171308';g.fill();g.strokeStyle=Y;g.lineWidth=3;g.stroke();
  txt('B-Roll Search',90,py+45,34,{fill:'#9a8a4a',rtl:false,align:'left',weight:600});
  const q='طبيعة';const n=Math.floor(clamp(prog(l,.45,1.0))*q.length);
  txt(q.slice(0,n)+(Math.floor(l*2.5)%2&&n<5?'|':''),990,py+47,48,{fill:WH,weight:700,align:'right'});
  // results grid 3x3
  const sel=[1,4,7];
  for(let k=0;k<9;k++){const cx=50+(k%3)*330,cy=475+Math.floor(k/3)*225;
    const d=easeOut(prog(l,1.0+k*.06,1.4+k*.06));if(d<=0)continue;
    g.save();g.globalAlpha=d;nature(cx,cy+(1-d)*30,320,200,k+1,t,16);playBadge(cx+160,cy+100,24);
    const si=sel.indexOf(k);if(si>=0&&l>1.35+si*.5&&l<1.35+si*.5+.5){g.strokeStyle=Y;g.lineWidth=7;rr(cx,cy,320,200,16);g.stroke()}
    g.restore()}
  // program monitor
  const cutT=[1.75,2.25,2.75];const cur=l<cutT[0]?0:l<cutT[1]?1:l<cutT[2]?2:3;

// ---------- smart zoom captions
function drawCaptions(t){
  const cur=captions.find(c=>t>=c.start&&t<c.end);if(!cur)return;
  const words=cur.words||[];const y=(t>=22)?1130:1450;
  g.save();g.font=`900 88px ${FONT}`;g.direction='rtl';
  const sp=30;const widths=words.map(w=>g.measureText(w.text).width);
  const total=widths.reduce((a,b)=>a+b,0)+sp*(words.length-1);g.restore();
  let x=W/2+total/2;const gp=prog(t,cur.start,cur.start+.12);
  words.forEach((w,i)=>{
    const cx=x-widths[i]/2;x-=widths[i]+sp;
    const on=t>=w.start&&t<w.end;
    const pop=on?1.12+.25*(1-easeOut(prog(t,w.start,w.start+.14))):1;
    g.save();g.translate(cx,y);const s=pop*(.85+.15*gp);g.scale(s,s);g.globalAlpha=t>=w.start-.3?1:.9;

}
const CUTS=[4,6,11,14,17,22];
window.renderFrame=function(t,layer='front'){

};
