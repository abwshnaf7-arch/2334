<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Happy Duck AI Reel</title>
<style>
@font-face{font-family:Cairo;src:url(assets/Cairo-Regular.ttf);font-weight:400}
@font-face{font-family:Cairo;src:url(assets/Cairo-Bold.ttf);font-weight:700}
@font-face{font-family:Cairo;src:url(assets/Cairo-Black.ttf);font-weight:900}
:root{--y:#FFD200;--bg:#090A0C;--bg2:#111317;--mut:#9499A1}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;background:var(--bg);overflow:hidden;font-family:Cairo,'Noto Color Emoji',sans-serif;color:#fff}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
.abs{position:absolute}
.layer{position:absolute;left:0;top:0;width:1080px;height:1920px;will-change:transform,opacity}
.txt{position:absolute;left:0;width:1080px;text-align:center;font-weight:900;line-height:1.15;text-shadow:0 6px 30px rgba(0,0,0,.6)}
.chip{position:absolute;display:flex;align-items:center;gap:18px;padding:22px 34px;border-radius:26px;background:rgba(17,19,23,.92);border:3px solid rgba(255,210,0,.55);font-weight:800;font-size:52px;white-space:nowrap;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.chip b{color:var(--y)}
.panel{position:absolute;border-radius:34px;overflow:hidden;box-shadow:0 0 0 4px rgba(255,210,0,.35),0 30px 90px rgba(0,0,0,.7),0 0 120px rgba(255,210,0,.18)}
.panel img{position:absolute;left:0;top:0;width:100%;height:100%}
.ring{position:absolute;border:6px solid var(--y);border-radius:28px;box-shadow:0 0 40px rgba(255,210,0,.8)}
.ripple{position:absolute;width:40px;height:40px;border-radius:50%;border:6px solid #fff;transform:translate(-50%,-50%)}
.pill{position:absolute;left:0;right:0;margin:0 auto;width:fit-content;padding:14px 34px;border-radius:999px;background:var(--y);color:#111;font-weight:900;font-size:46px;white-space:nowrap}
#cap{position:absolute;left:0;top:1650px;width:1080px;height:200px;display:flex;align-items:center;justify-content:center;direction:rtl}
.cw{display:inline-block;margin:0 10px;padding:4px 22px 10px;border-radius:22px;font-size:84px;font-weight:900;color:#fff;-webkit-text-stroke:0;text-shadow:0 4px 0 #000,0 0 14px #000,3px 3px 0 #000,-3px 3px 0 #000,3px -3px 0 #000,-3px -3px 0 #000;line-height:1.2}
.cw.on{background:var(--y);color:#111;text-shadow:none;transform:scale(1.06)}
.cw.en{direction:ltr;unicode-bidi:isolate}
svg{overflow:visible}
</style>
</head>
<body>
<div id="stage"></div>
<script src="scenes.js"></script>
</body>
</html>
