<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Motion</title>
<style>
@font-face{font-family:Cairo;font-weight:900;src:url(fonts/cairo-arabic-900.woff2) format('woff2');unicode-range:U+0600-06FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE80-FEFC}
@font-face{font-family:Cairo;font-weight:900;src:url(fonts/cairo-latin-900.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
html,body{margin:0;background:#fff;overflow:hidden}
svg{display:block}
text{font-family:Cairo,sans-serif;font-weight:900}
</style>
</head>
<body>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE27A"/>
      <stop offset=".32" stop-color="#FFF3C0"/>
      <stop offset=".70" stop-color="#FFFCEC"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="banG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE03D"/>
      <stop offset="1" stop-color="#FFC400"/>
    </linearGradient>
    <linearGradient id="cloudG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD21F" stop-opacity=".55"/>
      <stop offset="1" stop-color="#FFD21F" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bokeh"><stop offset="0" stop-color="#FFD21F" stop-opacity=".55"/><stop offset="1" stop-color="#FFD21F" stop-opacity="0"/></radialGradient>
    <filter id="fbA" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur id="fbAg" stdDeviation="0 0"/></filter><filter id="fbB" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur id="fbBg" stdDeviation="0 0"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <clipPath id="bannerClip"><rect x="-390" y="-85" width="780" height="170"/></clipPath>
  </defs>
  <rect width="1080" height="1920" fill="url(#bgG)"/>
  <g id="bg"></g>
  <g id="scenes"></g>
  <g id="trans"></g>
  <g id="hud"></g>
</svg>
<script src="anim.js"></script>
</body>
</html>
