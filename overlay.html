<meta charset="utf-8">
<title>overlay</title>
<style>
@font-face{font-family:'Fatimah Arabic ITF';src:url('fonts/FatimahArabicITF-Black.otf') format('opentype')}
html,body{margin:0;background:transparent;overflow:hidden}
#st{position:relative;width:1920px;height:1080px;direction:rtl;font-family:'Fatimah Arabic ITF','Cairo',sans-serif}
.g{position:absolute;opacity:0;will-change:transform}
.tape{background:#f6d92b;display:flex;align-items:center;justify-content:center;color:#111;white-space:nowrap;padding:0 28px;box-shadow:0 6px 14px rgba(0,0,0,.35);
 clip-path:polygon(0 6%,2% 0,4% 7%,96% 0,98% 8%,100% 3%,100% 94%,98% 100%,96% 92%,4% 100%,2% 93%,0 98%)}

.pap img{display:block;width:100%;height:auto;filter:drop-shadow(0 8px 14px rgba(0,0,0,.45))}
.pap .tx{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;color:#24160c;line-height:1.05;text-shadow:0 2px 2px rgba(0,0,0,.18)}
svg{position:absolute;overflow:visible}
</style>
<div id="st"></div>
<script>
var FPS=25,st=document.getElementById('st'),G=[];
function clamp(x){return x<0?0:x>1?1:x}
function bez(x1,y1,x2,y2){function f(t,a,b){return 3*a*(1-t)*(1-t)*t+3*b*(1-t)*t*t+t*t*t}
 return function(x){if(x<=0)return 0;if(x>=1)return 1;var lo=0,hi=1,t=x;for(var i=0;i<30;i++){t=(lo+hi)/2;if(f(t,x1,x2)<x)lo=t;else hi=t}return f(t,y1,y2)}}
var EI=bez(.12,0,.5,1), EO=bez(.5,0,.88,1);
function el(cls,html,css,parent){var e=document.createElement('div');e.className=cls;e.innerHTML=html||'';e.style.cssText=css||'';(parent||st).appendChild(e);return e}
function fit(box,maxW,size){var s=size;box.style.fontSize=s+'px';box.style.whiteSpace='nowrap';
 var w=box.scrollWidth; if(w>maxW){s=Math.floor(s*maxW/w);box.style.fontSize=s+'px'}}
/* g(el, tIn, tOut, fromX, rot, delay) */
function add(e,tin,tout,fx,rot,fy){G.push({e:e,a:tin,b:tout,fx:fx||0,fy:fy||0,rot:rot||0,ph:Math.random()*6})}
function tape(text,x,y,w,h,size,rot){var e=el('g tape',text,'left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+h+'px;font-size:'+size+'px');fit(e,w-60,size);return e}
function card(text,x,y,w,rot,src,tb){/* tb = text box [l,t,w,h] in % */
 var e=el('g pap','<img src="'+src+'">','left:'+x+'px;top:'+y+'px;width:'+w+'px');
 var t=el('tx',text,'left:'+tb[0]+'%;top:'+tb[1]+'%;width:'+tb[2]+'%;height:'+tb[3]+'%;',e);
 t.style.fontSize='60px';
 var lines=text.split('<br>').length,tw=w*tb[2]/100;fitBox(t,tw,tb[3]/100*w*0.78,lines);
 return e}
function fitBox(t,maxW,maxH,lines){var s=Math.min(90,Math.floor(maxH/lines/1.05));t.style.fontSize=s+'px';t.style.whiteSpace='nowrap';
 var w=t.scrollWidth;if(w>maxW)t.style.fontSize=Math.floor(s*maxW/w)+'px'}

function person(src,name,x,y,w){
 var g=el('g','','left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+(w*550/431+10+w*1024/1536)+'px');
 var ph=w*550/431;
 var p=el('pap','<img src="assets/paper.png">','position:absolute;left:0;top:0;width:'+w+'px',g);
 var im=document.createElement('img');im.src=src;im.style.cssText='position:absolute;left:12%;bottom:5%;width:76%;filter:drop-shadow(0 4px 6px rgba(0,0,0,.45))';p.appendChild(im);
 var c=el('pap','<img src="'+CARD+'">','position:absolute;left:0;top:'+(ph+10)+'px;width:'+w+'px',g);
 var t=el('tx',name,'left:22%;top:14%;width:72%;height:58%',c);fitBox(t,w*.72,.58*w*.78,name.split('<br>').length);
 return g}
var CARD='assets/index_card.webp',BAN='assets/paper_banner.webp';
function wavy(x,y,w,h,tin,tout){var s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('class','g');s.style.cssText='left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+h+'px';s.setAttribute('viewBox','0 0 '+w+' '+h);
 s.innerHTML='<path pathLength="1" d="M'+w/2+' 0 C'+(w*.1)+' '+h*.25+' '+(w*.9)+' '+h*.5+' '+w/2+' '+h*.75+' S'+(w*.5)+' '+h*.95+' '+w/2+' '+h+'" fill="none" stroke="#ea1717" stroke-width="12" stroke-linecap="round" style="stroke-dasharray:1;stroke-dashoffset:1"/>';
 st.appendChild(s);G.push({e:s,a:tin,b:tout,draw:true,fx:0,fy:0,rot:0,ph:0})}
function arrow(x1,y1,x2,y2,tin,tout){var w=Math.abs(x2-x1)+40,h=Math.abs(y2-y1)+40,s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('class','g');
 s.style.cssText='left:0;top:0;width:1920px;height:1080px';s.setAttribute('viewBox','0 0 1920 1080');
 var a=Math.atan2(y2-y1,x2-x1),L=44,p1=[x2-L*Math.cos(a-.45),y2-L*Math.sin(a-.45)],p2=[x2-L*Math.cos(a+.45),y2-L*Math.sin(a+.45)];
 s.innerHTML='<path pathLength="1" d="M'+x1+' '+y1+' L'+x2+' '+y2+'" stroke="#e11d1d" stroke-width="6" stroke-linecap="round" style="stroke-dasharray:1;stroke-dashoffset:1"/><path pathLength="1" d="M'+p1+' L'+x2+' '+y2+' L'+p2+'" fill="none" stroke="#e11d1d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:1;stroke-dashoffset:1"/>';
 st.appendChild(s);G.push({e:s,a:tin,b:tout,draw:true,fx:0,fy:0,rot:0,ph:0})}

function build(){
/* ---- cues from the SRT ---- */
var o=.22;
/* 1: 0-2  الإصلاح الديني */
add(tape('الإصلاح الديني',1420,400,480,125,74),0.12,2-o,200,-2);
/* 2: 2-6  جمال الدين الأفغاني / محمد عبده */
add(person('assets/afghani.png','جمال الدين<br>الأفغاني',1520,140,330),2.1,6-o,200);
add(person('assets/abduh.png','محمد عبده',1170,140,330),3.9,6-o,200);
/* 3: 6-10  الاهتمام بالناحية الدينية */
add(card('الاهتمام بالناحية<br>الدينية',1400,300,480,0,CARD,[10,14,80,58]),6.1,10-o,200);
/* 4: 10-13  اشمعنا الناحية الدينية؟ */
add(tape('اشمعنا',1450,360,430,120,72),10.0,13-o,200,-2);
add(tape('الناحية الدينية؟',1420,500,480,120,72),10.25,13-o,200,2);
/* 5: 13-16  خرافات وشعوذة (left side) */
add(card('خرافات',10,240,430,0,BAN,[14,20,70,36]),13.0,15.72-.2,-200,-1);
add(card('شعوذة',20,500,430,0,BAN,[14,20,70,36]),13.3,15.72-.2,-200,1);

}
window.setT=function(t){
 G.forEach(function(g){
  var pi=EI(clamp((t-g.a)/.6)),po=EO(clamp((t-g.b)/.35));
  var vis=t>=g.a&&t<g.b+.36;
  if(g.draw){var p=EI(clamp((t-g.a)/.5)),ps=g.e.querySelectorAll('path'),n=ps.length;
    ps.forEach(function(pa,i){var q=n>1?(i==0?clamp(p/.7):clamp((p-.7)/.3)):p;pa.style.strokeDashoffset=1-q});
    g.e.style.opacity=vis?(1-po):0;return}
  var op=Math.min(clamp(pi*2.5),1-po);
  var x=(1-pi)*g.fx+po*g.fx*.6, sc=(0.9+0.1*pi)*(1-0.08*po);
  var wob=0, rot=0;
  g.e.style.opacity=vis?op:0;
  g.e.style.filter=(pi<1)?'blur('+((1-pi)*6)+'px)':(po>0?'blur('+(po*5)+'px)':'');
  g.e.style.transform='translate('+x+'px,'+wob+'px) scale('+sc+')';
 });
};
document.fonts.load('60px "Fatimah Arabic ITF"').then(function(){return document.fonts.ready}).then(function(){build();document.title='ready';window.setT(0)});
</script>
