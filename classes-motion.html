<title>طبقات المجتمع المصري</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@600;800&display=swap">
<style>
@font-face{font-family:'Fatimah Arabic ITF';src:url('fonts/FatimahArabicITF-Black.otf') format('opentype');font-weight:400 900}
/* Layout: 16:9 paper-grid stage scaled from a 1666x926 design canvas, four RTL columns (class 1 on the right), scrubbable 22s timeline. */
:root{
  --page:#ece9e3; --page-ink:#2a2622; --page-line:#c9c4ba;
  --paper:#d9d6d0; --grid:rgba(120,115,105,.16);
  --ink:#171310; --sepia:#7a5a3c; --sepia-d:#4a3523; --tape:#f5d82e; --red:#d8334a;
  --font-display:'Fatimah Arabic ITF','Lalezar','Cairo','Segoe UI',sans-serif;
  --font-body:'Fatimah Arabic ITF','Cairo','Segoe UI',Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#1b1917;--page-ink:#e8e4dc;--page-line:#3a3631;color-scheme:dark}}
:root[data-theme="dark"]{--page:#1b1917;--page-ink:#e8e4dc;--page-line:#3a3631;color-scheme:dark}
body{background:var(--page);color:var(--page-ink);font-family:var(--font-body);padding-inline:16px;padding-block:20px}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.screen{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:var(--paper);border:1px solid var(--page-line)}
#stage{position:absolute;top:0;left:0;width:1666px;height:926px;transform-origin:0 0;direction:rtl;
  background-color:var(--paper);
}
#cam{position:absolute;left:0;top:0;width:1666px;height:926px;transform-origin:0 0;will-change:transform}
#bg{position:absolute;left:-2100px;top:-2100px;width:5900px;height:5900px;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:42px 42px}
#render-mode .bar{display:none}
#stage *{box-sizing:border-box}
.abs{position:absolute;opacity:0}
.tape{left:633px;top:56px;width:400px;height:96px;background:var(--tape);transform:rotate(-1deg);display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:74px;color:var(--ink);box-shadow:0 3px 8px rgba(0,0,0,.18);
  clip-path:polygon(0 4%,3% 0,6% 5%,94% 0,97% 6%,100% 2%,100% 96%,97% 100%,94% 94%,6% 100%,3% 95%,0 100%)}
.sub{left:333px;width:1000px;top:166px;text-align:center;font-family:var(--font-body);font-weight:800;font-size:34px;color:var(--sepia-d)}
.col{position:absolute;width:370px;top:0;height:926px}
.col>*{position:absolute;opacity:0}
.lbl{left:0;width:370px;top:190px;text-align:center;font-family:var(--font-display);font-size:60px;line-height:1;color:var(--ink)}
.lbl span{display:inline-block;color:var(--ink)}
.scr{left:45px;top:256px;width:280px;height:30px;overflow:visible}
.arr{left:150px;top:292px;width:70px;height:91px;overflow:visible}
.desc{left:0;width:370px;top:392px;text-align:center;font-family:var(--font-display);color:var(--ink)}
.desc b{display:block;font-weight:400;font-size:42px;line-height:1.25;color:var(--ink)}
.desc i{display:block;font-style:normal;font-size:34px;line-height:1.35;color:var(--ink)}
.ph img{display:block;width:100%;height:auto;filter:drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff) drop-shadow(0 8px 12px rgba(40,30,20,.35))}
.art{left:0;top:566px;width:370px;height:290px;overflow:visible}
.hl{background:linear-gradient(transparent 20%,rgba(245,216,46,.85) 20%,rgba(245,216,46,.85) 88%,transparent 88%);background-repeat:no-repeat;background-size:0% 100%;padding:0 10px}
.cap{left:333px;width:1000px;top:866px;text-align:center;font-weight:800;font-size:28px;color:var(--sepia-d)}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;direction:rtl}
.bar button{font:inherit;font-weight:800;background:var(--tape);color:#171310;border:2px solid #171310;padding:6px 18px;cursor:pointer;border-radius:2px}
.bar button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.bar input[type=range]{flex:1;min-width:140px;accent-color:#b8920a;direction:ltr}
.bar output{font-variant-numeric:tabular-nums;min-width:90px;direction:ltr;text-align:left}
</style>

<div class="wrap">
  <div class="screen" id="screen"><div id="stage"></div></div>
  <div class="bar">
    <button id="play" type="button">إيقاف</button>
    <button id="replay" type="button">إعادة</button>
    <input id="scrub" type="range" min="0" max="22" step="0.01" value="0" aria-label="الزمن">
    <output id="clock">0.0 / 22 ث</output>
  </div>
</div>

<script>
(function(){
var DUR=22, stage=document.getElementById('stage'), screenEl=document.getElementById('screen');
var NS='http://www.w3.org/2000/svg', items=[];

/* ---------- easing / effects ---------- */
function clamp(x){return x<0?0:x>1?1:x}
function backOut(x){var c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)}
function cubic(x){return 1-Math.pow(1-x,3)}
var FX={
  pop:function(el,p){var e=backOut(p);el.style.opacity=clamp(p*3);el.style.filter=p<1?'blur('+((1-p)*(1-p)*5)+'px)':'';el.style.transform='translateY('+((1-e)*36)+'px) scale('+(0.85+0.15*e)+')'},
  drop:function(el,p){var e=backOut(p);el.style.opacity=clamp(p*4);el.style.filter=p<1?'blur('+((1-p)*6)+'px)':'';el.style.transform='translateY('+((1-e)*-160)+'px) rotate('+(-1-(1-e)*6)+'deg)'},
  fade:function(el,p){el.style.opacity=cubic(p)},
  draw:function(el,p){el.style.opacity=p>0?1:0;el.querySelectorAll('path').forEach(function(pa,i){var n=pa.getAttribute('data-n')?+pa.getAttribute('data-n'):0;var q=n?clamp((p-.7*n)/(1-.7*n)):clamp(p/.7);pa.style.strokeDashoffset=1-q})},
  mark:function(el,p){el.style.backgroundSize=(cubic(p)*100)+'% 100%'}

function add(el,t,d,fx){items.push({el:el,t:t,d:d,fx:fx});}
function mk(tag,cls,html,parent){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;(parent||stage).appendChild(e);return e}

/* ---------- sepia sticker people (100x220 box) ---------- */
var K='#2a2018',SK='#c9a27a',W='#efe8d8';
function body(c,w){return '<path d="M'+(50-w)+' 62 Q50 52 '+(50+w)+' 62 L'+(50+w+4)+' 150 L'+(50-w-4)+' 150Z" fill="'+c+'" stroke="'+K+'" stroke-width="2.5"/>'}
function legs(c){return '<rect x="30" y="148" width="18" height="68" rx="5" fill="'+c+'" stroke="'+K+'" stroke-width="2.5"/><rect x="52" y="148" width="18" height="68" rx="5" fill="'+c+'" stroke="'+K+'" stroke-width="2.5"/>'}
function robe(c,w){return '<path d="M'+(50-w)+' 62 Q50 52 '+(50+w)+' 62 L'+(50+w+10)+' 214 L'+(50-w-10)+' 214Z" fill="'+c+'" stroke="'+K+'" stroke-width="2.5"/>'}
function head(){return '<circle cx="50" cy="32" r="20" fill="'+SK+'" stroke="'+K+'" stroke-width="2.5"/>'}
function arms(c,y){return '<path d="M24 66 L12 '+(y||120)+'" stroke="'+K+'" stroke-width="12" stroke-linecap="round"/><path d="M24 66 L12 '+(y||120)+'" stroke="'+c+'" stroke-width="8" stroke-linecap="round"/><path d="M76 66 L88 '+(y||120)+'" stroke="'+K+'" stroke-width="12" stroke-linecap="round"/><path d="M76 66 L88 '+(y||120)+'" stroke="'+c+'" stroke-width="8" stroke-linecap="round"/>'}
function tarbush(){return '<path d="M33 16 L36 -2 L64 -2 L67 16Z" fill="#8a4a35" stroke="'+K+'" stroke-width="2.5"/><path d="M50 -2 L50 -9" stroke="'+K+'" stroke-width="3"/>'}
var P={
 ruler:function(){return body('#3a2c20',27)+legs('#2a2018')+head()+arms('#3a2c20',118)+
   '<path d="M34 14 L34 -4 L42 6 L50 -8 L58 6 L66 -4 L66 14Z" fill="#f5d82e" stroke="'+K+'" stroke-width="2.5"/><path d="M30 66 L70 150" stroke="#f5d82e" stroke-width="7"/><path d="M40 72 L60 72" stroke="#f5d82e" stroke-width="0"/>'},
 rich:function(){return body('#2b2420',28)+legs('#1d1713')+head()+tarbush()+arms('#2b2420',120)+
   '<circle cx="92" cy="140" r="17" fill="#a98558" stroke="'+K+'" stroke-width="2.5"/><path d="M84 124 L100 124" stroke="'+K+'" stroke-width="4"/><text x="92" y="147" text-anchor="middle" font-family="Georgia,serif" font-size="20" font-weight="700" fill="#f5d82e">£</text>'},
 doctor:function(){return body(W,27)+legs('#5b4230')+head()+arms(W,120)+
   '<path d="M40 64 Q50 110 60 64" fill="none" stroke="'+K+'" stroke-width="3"/><circle cx="50" cy="106" r="6" fill="#8a8a8a" stroke="'+K+'" stroke-width="2"/><rect x="60" y="2" width="0" height="0"/><path d="M32 18 Q50 -4 68 18" fill="#3a2c20" stroke="'+K+'" stroke-width="2.5"/>'},
 lawyer:function(){return body('#4a3a2c',27)+legs('#2a2018')+head()+tarbush()+arms('#4a3a2c',125)+
   '<rect x="74" y="128" width="34" height="26" rx="3" fill="#6a4a30" stroke="'+K+'" stroke-width="2.5"/><path d="M85 128 L85 122 L97 122 L97 128" fill="none" stroke="'+K+'" stroke-width="3"/><path d="M50 66 L44 92 L56 92Z" fill="'+W+'" stroke="'+K+'" stroke-width="1.5"/>'},
 merchant:function(){return body('#8a6a4a',28)+legs('#3a2c20')+head()+tarbush()+arms('#8a6a4a',118)+
   '<rect x="76" y="104" width="30" height="38" rx="3" fill="'+W+'" stroke="'+K+'" stroke-width="2.5"/><path d="M82 114 L100 114 M82 122 L100 122 M82 130 L96 130" stroke="'+K+'" stroke-width="2.5"/>'},
 craft:function(){return body('#9a7a54',26)+legs('#4a3523')+head()+'<path d="M32 18 Q50 -6 68 18Z" fill="#5b4230" stroke="'+K+'" stroke-width="2.5"/>'+arms('#9a7a54',116)+
   '<path d="M38 80 L62 80 L66 150 L34 150Z" fill="#6a4a30" stroke="'+K+'" stroke-width="2"/><path d="M92 112 L92 70" stroke="'+K+'" stroke-width="6" stroke-linecap="round"/><rect x="80" y="58" width="26" height="14" rx="2" fill="#6c6c6c" stroke="'+K+'" stroke-width="2.5"/>'},
 shop:function(){return body('#b8996f',26)+legs('#5b4230')+head()+tarbush()+arms('#b8996f',122)+
   '<path d="M70 130 L112 130 L106 160 L76 160Z" fill="#8a6a4a" stroke="'+K+'" stroke-width="2.5"/><circle cx="84" cy="124" r="7" fill="#c9a24a" stroke="'+K+'" stroke-width="2"/><circle cx="98" cy="123" r="7" fill="#a85a3a" stroke="'+K+'" stroke-width="2"/>'},
 owner:function(){return body('#7a5a3c',26)+legs('#3a2c20')+head()+'<path d="M26 20 L74 20 L66 4 Q50 -6 34 4Z" fill="#e0cfa6" stroke="'+K+'" stroke-width="2.5"/>'+arms('#7a5a3c',116)+
   '<path d="M-6 200 L30 188 L106 188 L112 204 L-12 214Z" fill="#b8996f" stroke="'+K+'" stroke-width="2" opacity=".0"/><rect x="74" y="146" width="40" height="30" fill="#b8996f" stroke="'+K+'" stroke-width="2.5"/><path d="M80 146 L80 176 M90 146 L90 176 M100 146 L100 176" stroke="'+K+'" stroke-width="2"/>'},
 farmer:function(){return robe('#d9cdb4',27)+head()+'<path d="M30 20 Q50 -10 70 20 Q50 12 30 20Z" fill="'+W+'" stroke="'+K+'" stroke-width="2.5"/><ellipse cx="50" cy="9" rx="22" ry="12" fill="'+W+'" stroke="'+K+'" stroke-width="2.5"/>'+arms('#d9cdb4',120)+
   '<path d="M96 40 L84 190" stroke="#5b4230" stroke-width="6" stroke-linecap="round"/><path d="M96 40 L116 46 L110 58Z" fill="#6c6c6c" stroke="'+K+'" stroke-width="2.5"/>'},
 farmerw:function(){return robe('#6a4a30',26)+head()+'<path d="M28 24 Q28 -4 50 -4 Q72 -4 72 24 L66 36 L34 36Z" fill="#a85a3a" stroke="'+K+'" stroke-width="2.5"/><circle cx="50" cy="34" r="15" fill="'+SK+'"/>'+arms('#6a4a30',124)+
   '<path d="M62 134 Q86 176 112 134Z" fill="#c9a24a" stroke="'+K+'" stroke-width="2.5"/><path d="M70 134 L72 120 M84 134 L84 116 M98 134 L96 120" stroke="#f5d82e" stroke-width="4" stroke-linecap="round"/>'},
 worker:function(){return body('#5b6a78',28)+legs('#46525c')+head()+'<path d="M30 20 Q50 -6 70 20Z" fill="#3a2c20" stroke="'+K+'" stroke-width="2.5"/><rect x="26" y="18" width="48" height="6" rx="3" fill="#3a2c20" stroke="'+K+'" stroke-width="2"/>'+arms('#5b6a78',118)+
   '<path d="M94 118 L104 70" stroke="'+K+'" stroke-width="7" stroke-linecap="round"/><circle cx="106" cy="62" r="10" fill="none" stroke="#6c6c6c" stroke-width="6"/>'},
 farmer2:function(){return robe('#b8a98a',27)+head()+'<ellipse cx="50" cy="9" rx="22" ry="12" fill="#a79a7c" stroke="'+K+'" stroke-width="2.5"/>'+arms('#b8a98a',118)+
   '<path d="M92 120 L96 70" stroke="#5b4230" stroke-width="6" stroke-linecap="round"/><path d="M96 70 L112 50 M96 70 L84 48 M96 70 L98 42" stroke="#c9a24a" stroke-width="4" stroke-linecap="round"/>'},
 child:function(){return robe('#c9b48a',24)+head()+'<ellipse cx="50" cy="12" rx="18" ry="9" fill="#a79a7c" stroke="'+K+'" stroke-width="2.5"/>'+arms('#c9b48a',110)}
};
function art(col,list){
  var s=document.createElementNS(NS,'svg');s.setAttribute('class','art');s.setAttribute('viewBox','0 0 370 290');col.appendChild(s);
  var out=[];
  list.forEach(function(f,i){
    var g=document.createElementNS(NS,'g');
    g.setAttribute('transform','translate('+f.x+','+(290-220*f.s-4)+') scale('+f.s+')');
    var body=P[f.k]();
    g.innerHTML='<g stroke="#fff" stroke-width="'+(9/f.s)+'" stroke-linejoin="round" stroke-linecap="round" fill="#fff" opacity=".95">'+body.replace(/fill="[^"]*"/g,'fill="#fff"').replace(/stroke="[^"]*"/g,'stroke="#fff"')+'</g><g>'+body+'</g>';
    g.style.opacity=0;g.style.transformBox='fill-box';
    s.appendChild(g);out.push({g:g,base:'translate('+f.x+','+(290-220*f.s-4)+') scale('+f.s+')'});
  });
  return {svg:s,figs:out};
}
function scribble(){return '<svg class="scr" viewBox="0 0 280 30" fill="none"><path pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:1" d="M4 20 C40 6 70 26 110 14 S190 24 276 8" stroke="#d8334a" stroke-width="5" stroke-linecap="round"/><path pathLength="1" data-n="0.45" style="stroke-dasharray:1;stroke-dashoffset:1" d="M30 26 C80 16 140 28 220 18" stroke="#d8334a" stroke-width="3" stroke-linecap="round"/></svg>'}
function arrow(curve){var c=curve||0;return '<svg class="arr" viewBox="0 0 100 130" fill="none"><path pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:1" d="M50 2 C'+(46+c)+' 40 '+(54-c)+' 70 50 118" stroke="#171310" stroke-width="5" stroke-linecap="round"/><path pathLength="1" data-n="0.3" style="stroke-dasharray:1;stroke-dashoffset:1" d="M22 88 L50 120 L78 86" stroke="#171310" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>'}

/* ---------- content ---------- */
var tape=mk('div','abs tape','٤ طبقات');add(tape,0.1,1.0,FX.drop);

var CLS=[
 {n:'الطبقة الأولى',h:'الحكام والحاشية',l:['كبار الرأسماليين'],f:[{k:'ruler',x:50,s:1},{k:'rich',x:200,s:1}]},
 {n:'الطبقة الثانية',h:'الأطباء والمحامون',l:['كبار التجار والصناع'],f:[{k:'doctor',x:20,s:.86},{k:'lawyer',x:125,s:.86},{k:'merchant',x:240,s:.86}]},
 {n:'الطبقة الثالثة',h:'الحرفيون',l:['صغار التجار','صغار ملاك الأرض'],f:[{k:'craft',x:6,s:.7},{k:'shop',x:96,s:.7},{k:'owner',x:186,s:.7},{k:'craft',x:276,s:.66}]},
 {n:'الطبقة الرابعة',h:'المزارعون والعمال',l:['غالبية الشعب'],f:[{k:'farmer',x:2,s:.6},{k:'farmerw',x:60,s:.56},{k:'worker',x:116,s:.6},{k:'child',x:170,s:.36},{k:'farmer2',x:200,s:.6},{k:'farmerw',x:256,s:.56},{k:'farmer',x:304,s:.58}]}
];
var T0=2.0, STEP=4.5, CX=[1428,1058,688,318], CAMX=[1428,1058,688,310], hlEl;
var PH=[{src:'assets/c1.png',w:318,h:380,x:26},{src:'assets/c2.png',w:360,h:348,x:5},{src:'assets/c3.png',w:360,h:313,x:5},{src:'assets/c4.png',w:500,h:286,x:-80}];
CLS.forEach(function(c,i){
  var s=T0+i*STEP;
  var col=mk('div','col','');col.style.left=(CX[i]-185)+'px';
  var lbl=mk('div','lbl','<span>'+c.n+'</span>',col);
  col.insertAdjacentHTML('beforeend',scribble());var scr=col.lastChild;
  col.insertAdjacentHTML('beforeend',arrow(i%2?-6:6));var arr=col.lastChild;
  var d=mk('div','desc','<b>'+c.h+'</b>'+c.l.map(function(x,j){return '<i'+(i==3&&j==0?' id="maj"':'')+'>'+x+'</i>'}).join(''),col);
  add(lbl,s,.6,FX.pop);add(scr,s+.35,.6,FX.draw);add(arr,s+.7,.7,FX.draw);
  add(d,s+1.15,.6,FX.pop);
  var ph=PH[i],pd=mk('div','ph','<img src="'+ph.src+'" alt="">',col);
  pd.style.cssText='left:'+ph.x+'px;top:'+(905-ph.h)+'px;width:'+ph.w+'px;transform-origin:50% 100%';
  add(pd,s+1.4,.9,FX.pop);
  if(i==3){
    var m=col.querySelector('#maj');m.innerHTML='<span class="hl">غالبية الشعب</span>';hlEl=m.firstChild;
    add(hlEl,17.8,.8,FX.mark);
  }
});


/* ---------- camera (After Effects style: one move per class, then pull back) ---------- */
var cam=document.createElement('div');cam.id='cam';
var bg=document.createElement('div');bg.id='bg';cam.appendChild(bg);
while(stage.firstChild)cam.appendChild(stage.firstChild);stage.appendChild(cam);
cam.insertBefore(bg,cam.firstChild);
var CY=548,K=1.25,EASE=bez(.15,0,.5,1);
var KEYS=[[0,833,463,1],[1.3,833,463,1]];
for(var i=0;i<4;i++){var a=T0+i*STEP;KEYS.push([a+1.0,CAMX[i],CY,K]);KEYS.push([a+STEP-0.7,CAMX[i],CY,K])}
KEYS.pop();KEYS.push([19.4,CAMX[3],CY,K]);KEYS.push([21.4,833,463,1]);KEYS.push([22,833,463,1]);
function bez(x1,y1,x2,y2){
  function f(t,a,b){return 3*a*(1-t)*(1-t)*t+3*b*(1-t)*t*t+t*t*t}
  return function(x){if(x<=0)return 0;if(x>=1)return 1;var lo=0,hi=1,t=x;
    for(var i=0;i<30;i++){t=(lo+hi)/2;var v=f(t,x1,x2);if(v<x)lo=t;else hi=t}
    return f(t,y1,y2)}
}
function camAt(t){
  for(var i=0;i<KEYS.length-1;i++){var a=KEYS[i],b=KEYS[i+1];
    if(t<=b[0]||i==KEYS.length-2){var m=EASE(clamp((t-a[0])/(b[0]-a[0])));
      return [a[1]+(b[1]-a[1])*m,a[2]+(b[2]-a[2])*m,a[3]+(b[3]-a[3])*m]}}
}
function applyCam(t){
  var c=camAt(t),c2=camAt(Math.min(DUR,t+.03));
  cam.style.transform='translate('+(833-c[2]*c[0])+'px,'+(463-c[2]*c[1])+'px) scale('+c[2]+')';
  var vx=((c2[0]*c2[2])-(c[0]*c[2]))/.03,vy=((c2[1]*c2[2])-(c[1]*c[2]))/.03,vz=(c2[2]-c[2])/.03*500;
  var sp=Math.sqrt(vx*vx+vy*vy+vz*vz);
  var bl=Math.min(2.5,sp/900);
  cam.style.filter=bl>.4?'blur('+bl.toFixed(2)+'px)':'';
}

/* ---------- player ---------- */
var t=0,playing=true,last=null,playBtn=document.getElementById('play'),scrub=document.getElementById('scrub'),clock=document.getElementById('clock');
function render(){
  applyCam(t);items.forEach(function(it){var p=clamp((t-it.t)/it.d);it.fx(it.el,p)});
  scrub.value=t;clock.textContent=t.toFixed(1)+' / '+DUR+' ث';
}
function tick(ts){
  if(playing){ if(last!=null)t+=(ts-last)/1000; last=ts; if(t>=DUR){t=DUR;playing=false;playBtn.textContent='تشغيل'} render(); } else last=null;
  requestAnimationFrame(tick);
}
playBtn.onclick=function(){ if(t>=DUR)t=0; playing=!playing; last=null; playBtn.textContent=playing?'إيقاف':'تشغيل'};
document.getElementById('replay').onclick=function(){t=0;playing=true;last=null;playBtn.textContent='إيقاف'};
scrub.oninput=function(){t=+scrub.value;playing=false;last=null;playBtn.textContent='تشغيل';render()};
function fit(){stage.style.transform='scale('+(screenEl.clientWidth/1666)+')'}
window.addEventListener('resize',fit);fit();
