<!doctype html>
<meta charset="utf-8">
<title>suez-route</title>
<style>
@font-face{font-family:'Fatimah Arabic ITF';src:url('font.otf') format('opentype')}
html,body{margin:0;background:#0b0f12;overflow:hidden}
#c{display:block;width:100vw;height:100vh}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,rgba(0,0,0,0) 45%,rgba(0,0,0,.55) 100%)}
</style>
<canvas id="c"></canvas><div id="vig"></div>
<script src="data.js"></script>
<script type="module">
import * as THREE from './lib/three.module.js';
const D=window.DATA, W=D.W, H=D.H, MW=160, MH=MW*H/W;
const DUR=5;
const clamp=x=>x<0?0:x>1?1:x;
function bez(x1,y1,x2,y2){const f=(t,a,b)=>3*a*(1-t)*(1-t)*t+3*b*(1-t)*t*t+t*t*t;return x=>{if(x<=0)return 0;if(x>=1)return 1;let lo=0,hi=1,t=x;for(let i=0;i<30;i++){t=(lo+hi)/2;if(f(t,x1,x2)<x)lo=t;else hi=t}return f(t,y1,y2)}}
const EASE=bez(.15,0,.5,1), EOUT=bez(.2,0,.4,1);
const w=p=>new THREE.Vector3((p[0]/W-.5)*MW,0,(p[1]/H-.5)*MH);

/* ---------- renderer / scene ---------- */
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0b0f12);
scene.fog=new THREE.Fog(0x3a3d40,38,120);
const cam=new THREE.PerspectiveCamera(38,16/9,.5,400);

/* ---------- map texture ---------- */
function mapTexture(){
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');
  g.fillStyle='#0c1317';g.fillRect(0,0,W,H);
  // sea depth variation
  for(let i=0;i<260;i++){const x=Math.random()*W,y=Math.random()*H,r=120+Math.random()*420;const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba(30,48,58,.16)');gr.addColorStop(1,'rgba(30,48,58,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,2*r,2*r)}
  const land=document.createElement('canvas');land.width=W;land.height=H;const l=land.getContext('2d');
  const hl={826:'#a58f4a',818:'#c9a64a',356:'#a58f4a'};
  D.countries.forEach(c=>{
    const p=new Path2D(c.d);
    const base=hl[c.id];
    if(base){l.save();l.shadowColor='rgba(255,210,90,.9)';l.shadowBlur=60;l.fillStyle=base;l.fill(p);l.restore();l.fillStyle=base;l.fill(p)}
    else{const v=34+((c.id*37)%14);l.fillStyle=`rgb(${v},${v+2},${v+3})`;l.fill(p)}
  });
  // terrain-like noise on land
  l.globalCompositeOperation='source-atop';
  for(let i=0;i<1400;i++){const x=Math.random()*W,y=Math.random()*H,r=40+Math.random()*180;const a=Math.random()<.5;const gr=l.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,a?'rgba(255,255,255,.07)':'rgba(0,0,0,.18)');gr.addColorStop(1,'rgba(0,0,0,0)');l.fillStyle=gr;l.fillRect(x-r,y-r,2*r,2*r)}
  l.globalCompositeOperation='source-over';
  g.drawImage(land,0,0);
  // coast glow
  g.save();g.strokeStyle='rgba(190,200,205,.22)';g.lineWidth=3;D.countries.forEach(c=>g.stroke(new Path2D(c.d)));g.restore();
  g.strokeStyle='rgba(215,220,225,.28)';g.lineWidth=2.2;g.stroke(new Path2D(D.borders));
  // suez canal
  g.strokeStyle='#5fc4ff';g.lineWidth=9;g.lineCap='round';g.beginPath();g.moveTo(...D.pts.portsaid);g.lineTo(32.5/1e9+D.pts.suez[0],D.pts.suez[1]);g.stroke();
  const t=new THREE.CanvasTexture(cv);t.anisotropy=8;t.colorSpace=THREE.SRGBColorSpace;return t;
}
const mapMesh=new THREE.Mesh(new THREE.PlaneGeometry(MW,MH),new THREE.MeshBasicMaterial({map:mapTexture(),fog:true}));
mapMesh.rotation.x=-Math.PI/2;scene.add(mapMesh);

/* ---------- route ---------- */
const rp=D.route.map(w);
const curve=new THREE.CatmullRomCurve3(rp.map(v=>new THREE.Vector3(v.x,.18,v.z)),false,'centripetal');
const tube=new THREE.Mesh(new THREE.TubeGeometry(curve,400,.16,6,false),new THREE.MeshBasicMaterial({color:0xffd15a,transparent:true,opacity:.95,fog:false}));
scene.add(tube);
const tubeIdx=tube.geometry.index.count;
const halo=new THREE.Mesh(new THREE.TubeGeometry(curve,400,.5,6,false),new THREE.MeshBasicMaterial({color:0xffc24a,transparent:true,opacity:.18,fog:false,blending:THREE.AdditiveBlending,depthWrite:false}));
scene.add(halo);
const LEN=curve.getLength();
const suezU=(()=>{ // arc fraction of suez on curve
  let best=0,bd=1e9;const s=w(D.pts.suez);for(let i=0;i<=800;i++){const p=curve.getPointAt(i/800);const d=Math.hypot(p.x-s.x,p.z-s.z);if(d<bd){bd=d;best=i/800}}return best})();

/* ---------- ships ---------- */
const shipTex=await new THREE.TextureLoader().loadAsync('ship.png');shipTex.colorSpace=THREE.SRGBColorSpace;
const ships=[];
for(let i=0;i<4;i++){
  const m=new THREE.Sprite(new THREE.SpriteMaterial({map:shipTex,transparent:true,fog:false,depthWrite:false}));
  m.scale.set(5.4,5.4*598/1200,1);m.center.set(.5,0);scene.add(m);
  const sh=new THREE.Mesh(new THREE.PlaneGeometry(5.8,1.6),new THREE.MeshBasicMaterial({map:radTex('rgba(0,0,0,.7)'),transparent:true,depthWrite:false}));
  sh.rotation.x=-Math.PI/2;sh.position.y=.06;scene.add(sh);
  ships.push({m,sh,off:i*.055});
}
function radTex(col){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');const r=g.createRadialGradient(64,64,0,64,64,64);r.addColorStop(0,col);r.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=r;g.fillRect(0,0,128,128);return new THREE.CanvasTexture(c)}
// lead-ship progress: keyframes (time -> arc fraction)
function prog(t){const a=0.2,b=2.2,c=4.8;if(t<=a)return 0;if(t<=b)return suezU*(t-a)/(b-a);return suezU+(1-suezU)*clamp((t-b)/(c-b))}

/* ---------- Egypt: red haze + flag ---------- */
const eg=w(D.pts.suez);
const haze=new THREE.Mesh(new THREE.PlaneGeometry(46,46),new THREE.MeshBasicMaterial({map:radTex('rgba(210,30,40,.95)'),transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending,fog:false}));
haze.rotation.x=-Math.PI/2;haze.position.set(eg.x-1,.08,eg.z-3);scene.add(haze);
function jackTex(){const c=document.createElement('canvas');c.width=600;c.height=300;const g=c.getContext('2d');g.fillStyle='#012169';g.fillRect(0,0,600,300);
  g.strokeStyle='#fff';g.lineWidth=60;g.beginPath();g.moveTo(0,0);g.lineTo(600,300);g.moveTo(600,0);g.lineTo(0,300);g.stroke();
  g.strokeStyle='#C8102E';g.lineWidth=20;g.beginPath();g.moveTo(0,0);g.lineTo(600,300);g.moveTo(600,0);g.lineTo(0,300);g.stroke();
  g.fillStyle='#fff';g.fillRect(250,0,100,300);g.fillRect(0,100,600,100);g.fillStyle='#C8102E';g.fillRect(270,0,60,300);g.fillRect(0,120,600,60);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
const POLE=8;
const pole=new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,POLE,10),new THREE.MeshBasicMaterial({color:0xd8dde0,fog:false}));
pole.position.set(eg.x-8,POLE/2,eg.z+5);pole.scale.y=.001;scene.add(pole);
const flagGeo=new THREE.PlaneGeometry(4.8,2.4,26,12);
const flag=new THREE.Mesh(flagGeo,new THREE.MeshBasicMaterial({map:jackTex(),side:THREE.DoubleSide,fog:false}));
flag.visible=false;scene.add(flag);
const flagBase=flagGeo.attributes.position.array.slice();

/* ---------- labels ---------- */
function label(text,pos,size=11){
  const c=document.createElement('canvas');c.width=1024;c.height=256;const g=c.getContext('2d');
  g.font='bold 150px "Fatimah Arabic ITF"';g.textAlign='center';g.textBaseline='middle';g.direction='rtl';
  g.lineJoin='round';g.lineWidth=22;g.strokeStyle='rgba(0,0,0,.85)';g.strokeText(text,512,132);g.fillStyle='#fff';g.fillText(text,512,132);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,fog:false,depthTest:false,depthWrite:false}));
  s.scale.set(size,size/4,1);s.position.copy(pos);s.material.opacity=0;scene.add(s);return s}
const L={};
function buildLabels(){
  const up=(p,dy,dx=0,dz=0)=>{const v=w(p);v.y=dy;v.x+=dx;v.z+=dz;return v};
  L.uk=label('إنجلترا',up(D.pts.england,3,-1,-5));
  L.egypt=label('مصر',up(D.pts.egypt,3,-2,6),9);
  L.suez=label('قناة السويس',up(D.pts.suez,3,8,-2),11);
  L.india=label('الهند',up(D.pts.india,3,0,6),9);
}
const LT={uk:.1,egypt:1.55,suez:1.85,india:3.4};

/* ---------- camera path ---------- */
const T=k=>w(D.pts[k]);
const bell=(t,c,sg)=>Math.exp(-Math.pow((t-c)/sg,2));
function camTarget(t){
  const lead=curve.getPointAt(clamp(prog(t)+0.012));
  const eng=T('england').add(new THREE.Vector3(1.5,0,3));
  const sz=T('suez').add(new THREE.Vector3(-1.5,0,-2.5));
  const wE=clamp(1-t/1.25)*.85;
  const wS=bell(t,2.05,.75)*.8;
  const p=lead.clone().lerp(eng,wE);p.lerp(sz,wS);
  return p;
}
function setCam(t){
  const p=camTarget(t);
  const d=33-6*bell(t,2.0,.9)+4*clamp((t-3.8)/1.2);
  const k=d/35;
  cam.position.set(p.x+Math.sin(t*.35)*1.2,29*k,p.z+19.5*k);cam.lookAt(p.x,0,p.z);
}

/* ---------- time ---------- */
const tmp=new THREE.Vector3(),tg=new THREE.Vector3();
window.setT=function(t){
  setCam(t);
  const pl=prog(t);
  // route reveal
  const reach=clamp(pl+0.012);tube.geometry.setDrawRange(0,Math.floor(tubeIdx*reach/6)*6);halo.geometry.setDrawRange(0,Math.floor(tubeIdx*reach/6)*6);
  ships.forEach((s,i)=>{
    const u=clamp(pl-s.off);const show=clamp((pl-s.off)*60);
    curve.getPointAt(u,tmp);curve.getPointAt(clamp(u+.004),tg);
    s.m.position.set(tmp.x,.12,tmp.z);s.sh.position.set(tmp.x,.07,tmp.z);
    const dir=tg.x-tmp.x;s.m.scale.x=(dir<-0.0005?-1:1)*5.4;
    s.m.material.opacity=show;s.sh.material.opacity=show;s.m.visible=show>0.02;s.sh.visible=show>0.02;
  });
  // egypt secure
  const ei=EASE(clamp((t-1.3)/.9));
  haze.material.opacity=ei*(.75+.12*Math.sin(t*5));haze.scale.setScalar(.7+.3*ei+.03*Math.sin(t*5));
  pole.scale.y=Math.max(.001,ei);
  flag.visible=ei>.6;
  const fi=clamp((ei-.6)/.4);
  const pa=flagGeo.attributes.position;
  for(let i=0;i<pa.count;i++){const x=flagBase[i*3]+2.4,y=flagBase[i*3+1];const u=x/4.8;
    pa.setXYZ(i,flagBase[i*3]+2.4,y,Math.sin(u*7-t*7)*.38*u+Math.sin(u*3-t*4+y)*.14*u)}
  pa.needsUpdate=true;
  flag.position.set(pole.position.x+.13,POLE-1.2-(1-fi)*3,pole.position.z);flag.scale.set(fi,fi,1);
  // labels
  for(const k in L){const e=EASE(clamp((t-LT[k])/.5));L[k].material.opacity=e;const base=L[k].userData.y??(L[k].userData.y=L[k].position.y);L[k].position.y=base+(1-e)*1.5}
  renderer.setSize(canvas.clientWidth,canvas.clientHeight,false);cam.aspect=canvas.clientWidth/canvas.clientHeight;cam.updateProjectionMatrix();
  renderer.render(scene,cam);
};
document.fonts.load('bold 100px "Fatimah Arabic ITF"').then(()=>document.fonts.ready).then(()=>{buildLabels();
  document.title='ready';window.setT(0)});
</script>
