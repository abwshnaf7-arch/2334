<!doctype html>
<meta charset="utf-8">
<title>suez-route</title>
<style>
@font-face{font-family:'Fatimah Arabic ITF';src:url('font.otf') format('opentype')}
html,body{margin:0;background:#05080c;overflow:hidden}
#c{display:block;width:100vw;height:100vh}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,rgba(0,0,0,0) 55%,rgba(0,0,0,.4) 100%)}
</style>
<canvas id="c"></canvas><div id="vig"></div>
<script type="module">
import * as THREE from './lib/three.module.js';
const IW=1448, IH=1086, U=10;            // 1 world unit = 10 image px
const MW=IW/U, MH=IH/U, DUR=4;
const clamp=x=>x<0?0:x>1?1:x;
function bez(x1,y1,x2,y2){const f=(t,a,b)=>3*a*(1-t)*(1-t)*t+3*b*(1-t)*t*t+t*t*t;return x=>{if(x<=0)return 0;if(x>=1)return 1;let lo=0,hi=1,t=x;for(let i=0;i<30;i++){t=(lo+hi)/2;if(f(t,x1,x2)<x)lo=t;else hi=t}return f(t,y1,y2)}}
const EASE=bez(.15,0,.5,1);
const P=(x,y,h=0)=>new THREE.Vector3((x-IW/2)/U,h,(y-IH/2)/U);   // image px -> world

const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x05080c);
const cam=new THREE.PerspectiveCamera(38,16/9,.5,500);
const PITCH=60*Math.PI/180;

/* ---------- map picture ---------- */
const earthTex=await new THREE.TextureLoader().loadAsync('earth.jpg');earthTex.colorSpace=THREE.SRGBColorSpace;earthTex.anisotropy=8;earthTex.wrapS=earthTex.wrapT=THREE.MirroredRepeatWrapping;
const mg=new THREE.PlaneGeometry(MW*3,MH*3);{const uv=mg.attributes.uv;for(let i=0;i<uv.count;i++){uv.setXY(i,uv.getX(i)*3-1,uv.getY(i)*3-1)}}
const map=new THREE.Mesh(mg,new THREE.MeshBasicMaterial({map:earthTex}));
map.rotation.x=-Math.PI/2;scene.add(map);

/* ---------- route: Gibraltar -> Mediterranean -> Suez -> Red Sea -> Arabian Sea -> India (image px) ---------- */
const RT=[[178,486],[240,492],[300,492],[350,480],[400,500],[440,535],[500,552],[560,572],[606,598],[614,622],[622,655],[648,700],[684,765],[716,826],[748,886],[774,934],[830,966],[900,982],[980,962],[1060,912],[1108,852],[1136,800],[1150,764]];
const rp=RT.map(p=>P(p[0],p[1],.4));
const curve=new THREE.CatmullRomCurve3(rp,false,'centripetal');
const tube=new THREE.Mesh(new THREE.TubeGeometry(curve,500,.34,6,false),new THREE.MeshBasicMaterial({color:0xffd15a}));
tube.renderOrder=1;scene.add(tube);
const halo=new THREE.Mesh(new THREE.TubeGeometry(curve,500,1.0,6,false),new THREE.MeshBasicMaterial({color:0xffc24a,transparent:true,opacity:.2,blending:THREE.AdditiveBlending,depthWrite:false}));
scene.add(halo);
const tubeIdx=tube.geometry.index.count;
const SUEZ_PX=[618,640];
const suezU=(()=>{let best=0,bd=1e9;const s=P(...SUEZ_PX);for(let i=0;i<=800;i++){const p=curve.getPointAt(i/800);const d=Math.hypot(p.x-s.x,p.z-s.z);if(d<bd){bd=d;best=i/800}}return best})();
function prog(t){const a=.15,b=1.75,c=3.7;if(t<=a)return 0;if(t<=b)return suezU*(t-a)/(b-a);return suezU+(1-suezU)*clamp((t-b)/(c-b))}

/* ---------- ships (on top of the line) ---------- */
function radTex(col){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');const r=g.createRadialGradient(64,64,0,64,64,64);r.addColorStop(0,col);r.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=r;g.fillRect(0,0,128,128);return new THREE.CanvasTexture(c)}
const shipTex=await new THREE.TextureLoader().loadAsync('ship.png');shipTex.colorSpace=THREE.SRGBColorSpace;
const SW=8.5;
const ships=[];
for(let i=0;i<4;i++){
  const m=new THREE.Sprite(new THREE.SpriteMaterial({map:shipTex,transparent:true,depthWrite:false,depthTest:false}));
  m.scale.set(SW,SW*598/1200,1);m.center.set(.5,.2);m.renderOrder=5;scene.add(m);
  const sh=new THREE.Mesh(new THREE.PlaneGeometry(SW*1.08,SW*.28),new THREE.MeshBasicMaterial({map:radTex('rgba(0,0,0,.65)'),transparent:true,depthWrite:false}));
  sh.rotation.x=-Math.PI/2;scene.add(sh);
  ships.push({m,sh,off:i*.075});
}

/* ---------- Egypt flag, standing inside Egypt's border ---------- */
function flagTex(){const c=document.createElement('canvas');c.width=600;c.height=400;const g=c.getContext('2d');
  g.fillStyle='#CE1126';g.fillRect(0,0,600,134);g.fillStyle='#fff';g.fillRect(0,133,600,134);g.fillStyle='#000';g.fillRect(0,266,600,134);
  // simplified golden eagle of Saladin
  g.save();g.translate(300,200);g.fillStyle='#C09300';
  g.beginPath();g.arc(0,-52,19,0,7);g.fill();                                   // head
  g.fillRect(-20,-36,40,72);                                                    // body
  g.beginPath();g.moveTo(-20,-30);g.quadraticCurveTo(-92,-34,-84,30);g.lineTo(-62,18);g.lineTo(-60,36);g.lineTo(-38,22);g.lineTo(-36,40);g.lineTo(-20,30);g.closePath();g.fill();
  g.beginPath();g.moveTo(20,-30);g.quadraticCurveTo(92,-34,84,30);g.lineTo(62,18);g.lineTo(60,36);g.lineTo(38,22);g.lineTo(36,40);g.lineTo(20,30);g.closePath();g.fill();
  g.fillStyle='#CE1126';g.fillRect(-14,-28,28,18);g.fillStyle='#fff';g.fillRect(-14,-10,28,18);g.fillStyle='#000';g.fillRect(-14,8,28,18);
  g.fillStyle='#C09300';g.fillRect(-24,40,48,12);
  g.restore();
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
const FLW=6.2,FLH=4.1,POLE=8.5;
const egy=new THREE.Group();egy.position.copy(P(540,742,.5));egy.rotation.x=-PITCH;scene.add(egy);
const pole=new THREE.Mesh(new THREE.CylinderGeometry(.14,.14,POLE,10),new THREE.MeshBasicMaterial({color:0xe8e8e8}));
pole.position.y=POLE/2;pole.scale.y=.001;egy.add(pole);
const flagGeo=new THREE.PlaneGeometry(FLW,FLH,24,10);
const flag=new THREE.Mesh(flagGeo,new THREE.MeshBasicMaterial({map:flagTex(),side:THREE.DoubleSide}));
flag.visible=false;egy.add(flag);
const flagBase=flagGeo.attributes.position.array.slice();

/* ---------- Suez label (same pill style as the picture) ---------- */
function pill(text){
  const c=document.createElement('canvas');c.width=1024;c.height=256;const g=c.getContext('2d');
  g.font='bold 120px "Fatimah Arabic ITF"';g.textAlign='center';g.textBaseline='middle';g.direction='rtl';
  const w=Math.min(960,g.measureText(text).width+110);
  const x=(1024-w)/2,y=40,h=176,r=40;
  g.fillStyle='rgba(8,12,24,.94)';g.strokeStyle='#d9a63a';g.lineWidth=7;
  g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();g.fill();g.stroke();
  g.fillStyle='#fff';g.fillText(text,512,132);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
const lab=new THREE.Sprite(new THREE.SpriteMaterial({map:pill('قناة السويس'),transparent:true,depthTest:false,depthWrite:false}));
lab.scale.set(19,4.75,1);lab.position.copy(P(760,648,1.5));lab.renderOrder=9;lab.material.opacity=0;scene.add(lab);
// leader line from the label to the canal
const leader=new THREE.Line(new THREE.BufferGeometry().setFromPoints([P(716,646,1),P(624,642,1)]),new THREE.LineBasicMaterial({color:0xd9a63a,transparent:true,opacity:0}));
leader.renderOrder=8;scene.add(leader);

/* ---------- camera: wide, gentle drift, never follows the ships ---------- */
function setCam(t){
  const u=EASE(clamp(t/DUR));
  const cx=806-10*u, cy=642+4*u;
  const d=108-6*u;
  const p=P(cx,cy);
  cam.position.set(p.x,d*Math.sin(PITCH),p.z+d*Math.cos(PITCH));cam.lookAt(p.x,0,p.z);
}

const tmp=new THREE.Vector3(),tg=new THREE.Vector3();
window.setT=function(t){
  setCam(t);
  const pl=prog(t);
  const cnt=Math.floor(tubeIdx*clamp(pl+.01)/6)*6;tube.geometry.setDrawRange(0,cnt);halo.geometry.setDrawRange(0,cnt);
  ships.forEach(s=>{
    const u=clamp(pl-s.off),show=clamp((pl-s.off)*60);
    curve.getPointAt(u,tmp);curve.getPointAt(clamp(u+.004),tg);
    s.m.position.set(tmp.x,.6,tmp.z);s.sh.position.set(tmp.x,.2,tmp.z);
    s.m.scale.x=(tg.x-tmp.x<-0.0005?-1:1)*SW;
    s.m.material.opacity=show;s.sh.material.opacity=show;s.m.visible=s.sh.visible=show>.02;
  });
  // Egypt flag raises
  const ei=EASE(clamp((t-.7)/.7));
  pole.scale.y=Math.max(.001,ei);
  const fi=clamp((ei-.55)/.45);flag.visible=fi>0;
  const pa=flagGeo.attributes.position;
  for(let i=0;i<pa.count;i++){const x=flagBase[i*3]+FLW/2,y=flagBase[i*3+1];const u=x/FLW;
    pa.setXYZ(i,x*(1-.05*Math.sin(u*6-t*7)*u),y+Math.sin(u*6-t*7)*.22*u,0)}
  pa.needsUpdate=true;
  flag.position.set(.14,POLE-FLH/2-.15-(1-fi)*4,0);flag.scale.set(fi,fi,1);
  // label
  const li=EASE(clamp((t-1.35)/.5));lab.material.opacity=li;leader.material.opacity=li*.9;
  renderer.setSize(canvas.clientWidth,canvas.clientHeight,false);cam.aspect=canvas.clientWidth/canvas.clientHeight;cam.updateProjectionMatrix();
  renderer.render(scene,cam);
};
await document.fonts.load('bold 100px "Fatimah Arabic ITF"');await document.fonts.ready;
lab.material.map=pill('قناة السويس');lab.material.needsUpdate=true;
document.title='ready';window.setT(0);
</script>
